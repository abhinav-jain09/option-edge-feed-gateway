# P1 (log redaction): if container access logging is enabled, log the request PATH only (%U) and NEVER the
# query string (%q), so a ticket (or any secret) can never leak into access/proxy logs. Tickets now travel
# in the Sec-WebSocket-Protocol header rather than the URL, so this is defense in depth. The pattern only
# takes effect when access logging is turned on (server.tomcat.accesslog.enabled=true); it never widens it.
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b %D

# /api/stock-gex/stream is a long-lived SSE proxy served by a StreamingResponseBody, i.e. a Servlet
# ASYNC request. Tomcat's default async timeout is 30s, which would tear down a perfectly healthy
# stream every 30 seconds and make the page look like it kept losing the feed. A negative value means
# "no timeout" per the Servlet spec (AsyncContext.setTimeout <= 0), which is the correct budget for a
# stream whose liveness is already proven by the upstream's ~10s heartbeat: a dead peer is detected by
# the next heartbeat write failing, not by a clock.
#
# THIS SETTING IS GLOBAL, and removing the only deadline on async dispatch is only safe because the MVC
# async thread pool was also made explicit — see StockGexAsyncConfig. With Boot's default pool (core 8,
# unbounded queue) the ninth concurrent streaming response would QUEUE rather than run, and with no
# timeout it would queue forever, answering nothing. The two changes belong together; do not keep one
# without the other.
spring.mvc.async.request-timeout=-1

# NOTE (stock-gex upstream): the base URL is NOT set here. GatewaySettings resolves config from the
# environment and system properties only (it is read from plain static helpers, not from the Spring
# Environment), so a value in this file would silently have no effect. Configure it as the env var
# STOCK_GEX_BASE_URL (or -Dstock-gex.base-url); the built-in default is http://stock-gex-service:8021.
